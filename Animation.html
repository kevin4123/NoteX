<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>桶形移位器交互原理图</title>
    <style>
        :root {
            --primary: #4a90e2;
            --bg: #f5f7fa;
            --wire: #bdc3c7;
            --active: #e74c3c;
        }
        body { font-family: system-ui, sans-serif; background: var(--bg); display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); max-width: 800px; width: 100%; }
        h2 { margin-top: 0; color: #333; }
        
        .controls { margin-bottom: 30px; background: #eee; padding: 15px; border-radius: 8px; }
        .bit-row { display: flex; gap: 10px; justify-content: center; margin: 10px 0; }
        .bit { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; 
                   border: 2px solid #34495e; border-radius: 4px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .bit.on { background: var(--primary); color: white; border-color: var(--primary); }
        .bit.off { background: white; color: #34495e; }
        
        .shifter-logic { position: relative; height: 300px; margin: 40px 0; border-top: 2px solid #ddd; border-bottom: 2px solid #ddd; overflow: hidden;}
        .stage-label { position: absolute; left: 0; font-size: 12px; color: #7f8c8d; font-style: italic; }
        
        canvas { position: absolute; top: 0; left: 0; pointer-events: none; }
        
        .output-info { text-align: center; font-size: 1.2rem; font-weight: bold; color: var(--active); margin-top: 20px; }
        .binary-display { font-family: monospace; background: #2c3e50; color: #27ae60; padding: 5px 15px; border-radius: 4px; }
    </style>
</head>
<body>

<div class="container">
    <h2>8位桶形移位器 (逻辑右移)</h2>
    <p>点击上方输入位改变数值，拖动滑块观察对数级移位路径。</p>

    <div class="controls">
        <div>输入数据 (Input Bits):</div>
        <div class="bit-row" id="inputRow">
            <!-- JS 生成位 -->
        </div>
        <div style="margin-top:20px;">
            <label>移位量 (Shift Amount): <span id="shiftVal">0</span> 位</label>
            <input type="range" id="shiftRange" min="0" max="7" value="0" style="width: 100%;">
        </div>
    </div>

    <div class="shifter-logic" id="visualizer">
        <div class="stage-label" style="top: 10px;">输入层</div>
        <div class="stage-label" style="top: 90px;">第一阶段 (移4位?)</div>
        <div class="stage-label" style="top: 170px;">第二阶段 (移2位?)</div>
        <div class="stage-label" style="top: 250px;">最终输出 (移1位?)</div>
        <canvas id="canvas"></canvas>
    </div>

    <div class="output-info">
        输出结果: <span class="binary-display" id="outputBinary">00000000</span>
    </div>
</div>

<script>
    const inputRow = document.getElementById('inputRow');
    const shiftRange = document.getElementById('shiftRange');
    const shiftValDisplay = document.getElementById('shiftVal');
    const outputBinary = document.getElementById('outputBinary');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let bits = [1, 0, 1, 1, 0, 0, 1, 0];
    let shift = 0;

    // 初始化输入位
    function init() {
        inputRow.innerHTML = '';
        bits.forEach((bit, i) => {
            const div = document.createElement('div');
            div.className = `bit ${bit ? 'on' : 'off'}`;
            div.textContent = bit;
            div.onclick = () => {
                bits[i] = bits[i] ? 0 : 1;
                update();
            };
            inputRow.appendChild(div);
        });
        update();
    }

    function update() {
        shift = parseInt(shiftRange.value);
        shiftValDisplay.textContent = shift;
        
        // 计算每一层的结果
        let stage0 = [...bits];
        let stage1 = (shift & 4) ? Array(4).fill(0).concat(stage0.slice(0, 4)) : [...stage0];
        let stage2 = (shift & 2) ? Array(2).fill(0).concat(stage1.slice(0, 6)) : [...stage1];
        let stage3 = (shift & 1) ? Array(1).fill(0).concat(stage2.slice(0, 7)) : [...stage2];

        outputBinary.textContent = stage3.join('');
        
        // 更新 UI 样式
        Array.from(inputRow.children).forEach((child, i) => {
            child.className = `bit ${bits[i] ? 'on' : 'off'}`;
            child.textContent = bits[i];
        });

        drawPaths(stage0, stage1, stage2, stage3);
    }

    function drawPaths(s0, s1, s2, s3) {
        const w = visualizer.clientWidth;
        const h = visualizer.clientHeight;
        canvas.width = w;
        canvas.height = h;
        
        const bitGap = w / 9;
        const startX = bitGap;
        const rowH = 80;

        ctx.clearRect(0, 0, w, h);

        function drawLayer(data, nextData, y, shiftAmount, isActive) {
            data.forEach((val, i) => {
                const x = startX + i * bitGap;
                const nextX = isActive ? (startX + (i + shiftAmount) * bitGap) : x;
                
                // 只绘制在 8 位范围内的线
                if (i + (isActive ? shiftAmount : 0) < 8) {
                    ctx.beginPath();
                    ctx.moveTo(x, y);
                    ctx.bezierCurveTo(x, y + 40, nextX, y + 40, nextX, y + rowH);
                    ctx.strokeStyle = val && ( (isActive && (shift & shiftAmount)) || (!isActive && !(shift & shiftAmount)) ) ? '#4a90e2' : '#ddd';
                    ctx.lineWidth = val ? 3 : 1;
                    ctx.stroke();
                }
            });
        }

        // 绘制三层逻辑
        // 第一层决定移4位 (8->4)
        const s1Active = (shift & 4);
        drawLayer(s0, s1, 20, 4, s1Active); 
        
        // 第二层决定移2位
        const s2Active = (shift & 2);
        drawLayer(s1, s2, 100, 2, s2Active);

        // 第三层决定移1位
        const s3Active = (shift & 1);
        drawLayer(s2, s3, 180, 1, s3Active);
    }

    shiftRange.oninput = update;
    window.onresize = update;
    init();
</script>
</body>
</html>
